<section class="sec" data-sec="s101">
  <div class="s101__wrap">
    <header class="s101__head">
      <p class="s101__eyebrow">HARU NOODLE · 창업비용 시뮬레이터</p>
      <h2 class="s101__title">내 가게 크기에 맞춰<br>창업비용을 직접 그려보세요</h2>
    </header>
    <div class="s101__panel">
      <div class="s101__controls">
        <label class="s101__ctl">
          <span class="s101__lab">매장 평수 <b data-val="py">18평</b></span>
          <input type="range" min="8" max="40" step="1" value="18" data-in="py" aria-label="매장 평수">
          <span class="s101__ticks"><i>8평</i><i>24평</i><i>40평</i></span>
        </label>
        <label class="s101__ctl">
          <span class="s101__lab">인테리어 등급 <b data-val="gr">프리미엄</b></span>
          <input type="range" min="0" max="2" step="1" value="1" data-in="gr" aria-label="인테리어 등급">
          <span class="s101__ticks"><i>스탠다드</i><i>프리미엄</i><i>시그니처</i></span>
        </label>
        <p class="s101__hint">슬라이더를 움직이면 항목별 비용 막대가 늘고 줄어듭니다. 가맹비와 교육비는 고정, 인테리어·설비·보증금은 평수에 비례합니다.</p>
        <a class="s101__cta" href="#">이 조건으로 상담 신청<span>→</span></a>
      </div>
      <div class="s101__result">
        <div class="s101__total">
          <span class="s101__tl">예상 총 창업비용</span>
          <div class="s101__tn"><div class="s101__odo" data-odo></div><span class="s101__unit">만원</span></div>
        </div>
        <div class="s101__bar" data-bar></div>
        <ul class="s101__legend" data-legend></ul>
      </div>
    </div>
    <p class="s101__foot">※ 예시 시뮬레이션이며 수익을 보장하지 않습니다. 가상 브랜드 기준의 가정 수치이며 실제 비용은 상권·계약 조건에 따라 달라집니다.</p>
  </div>
</section>

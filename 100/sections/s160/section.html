<section class="sec" data-sec="s160">
  <div class="s160__copy">
    <p class="s160__eyebrow">소담 양념 · 호리병 시리즈</p>
    <h2 class="s160__title">뒤집을 때마다<br>새로 쌓이는 한 병</h2>
    <p class="s160__body">소금, 고춧가루, 간장, 참기름. 무게가 다른 네 가지 양념이 호리병 속에서 스스로 층을 쌓습니다. 병을 돌려 보세요. 가루는 가라앉고, 기름은 떠오릅니다.</p>
    <ul class="s160__legend">
      <li><i class="s160__sw s160__sw--salt"></i>소금</li>
      <li><i class="s160__sw s160__sw--chili"></i>고춧가루</li>
      <li><i class="s160__sw s160__sw--soy"></i>간장</li>
      <li><i class="s160__sw s160__sw--oil"></i>참기름</li>
    </ul>
    <button class="s160__flip" type="button">병 뒤집기 <span>↻</span></button>
  </div>
  <div class="s160__stage">
    <i class="s160__glow"></i>
    <canvas class="s160__cv" aria-label="회전하는 호리병"></canvas>
    <i class="s160__shadow"></i>
  </div>
  <p class="s160__hint">병을 잡고 돌려 보세요</p>
</section>

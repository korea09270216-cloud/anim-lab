  <template data-tpl>
    <article class="s062__item" data-y="2011"><div class="s062__dot"></div><span class="s062__yr">2011</span><h3>성수동 6평, 첫 번째 로스터리</h3><p>작은 직화 로스터 한 대로 시작. 손님이 직접 원두 향을 맡아보고 고르는 '향기 바'가 입소문을 타며 첫 해 단골 1,200명을 확보했습니다.</p><span class="s062__tag">1호점 오픈</span></article>
    <article class="s062__item" data-y="2013"><div class="s062__dot"></div><span class="s062__yr">2013</span><h3>양평 로스팅 센터 가동</h3><p>월 40톤 생산 규모의 자체 로스팅 센터를 열고 당일 로스팅 · 48시간 출고 체계를 완성. 모든 매장 맛의 편차를 3% 이내로 관리합니다.</p><span class="s062__tag">자체 생산 체계</span></article>
    <article class="s062__item" data-y="2015"><div class="s062__dot"></div><span class="s062__yr">2015</span><h3>100호점, 가맹 사업 시작</h3><p>'동네 로스터리' 콘셉트의 15평 표준 모델을 개발. 점주 교육 6주 과정과 바리스타 인증제를 도입하며 가맹 문을 열었습니다.</p><span class="s062__tag">가맹 모델 론칭</span></article>
    <article class="s062__item" data-y="2017"><div class="s062__dot"></div><span class="s062__yr">2017</span><h3>모닝브루 앱 · 멤버십</h3><p>픽업 오더와 스탬프, 원두 구독을 한 앱에. 출시 6개월 만에 가입자 50만 명, 점심 전 주문 비중 38%를 기록했습니다.</p><span class="s062__tag">디지털 전환</span></article>
    <article class="s062__item" data-y="2019"><div class="s062__dot"></div><span class="s062__yr">2019</span><h3>500호점 · 원두 직거래 확대</h3><p>에티오피아 구지, 콜롬비아 우일라 농가와 3개년 구매 계약. 공정가 프리미엄을 선지급해 농가 소득을 평균 22% 높였습니다.</p><span class="s062__tag">직거래 농가 120곳</span></article>
    <article class="s062__item" data-y="2021"><div class="s062__dot"></div><span class="s062__yr">2021</span><h3>제주 로스터리 캠퍼스</h3><p>로스팅 · 교육 · 체험이 한 곳에. 연 18만 명이 방문하는 브랜드 플래그십이자 바리스타 아카데미의 본원이 되었습니다.</p><span class="s062__tag">플래그십 오픈</span></article>
    <article class="s062__item" data-y="2023"><div class="s062__dot"></div><span class="s062__yr">2023</span><h3>1,000호점 돌파</h3><p>창업 후 12년 만에 전국 1,000번째 매장 오픈. 폐점률 2.1%, 점주 재계약률 96%로 가맹 안정성을 증명했습니다.</p><span class="s062__tag">전국 1,000개</span></article>
    <article class="s062__item" data-y="2025"><div class="s062__dot"></div><span class="s062__yr">2025</span><h3>탄소중립 매장 시범 운영</h3><p>커피박 업사이클링, 재사용 컵 보증금제, 태양광 로스터를 갖춘 그린 스토어 30곳을 운영하며 다음 10년의 기준을 세웁니다.</p><span class="s062__tag">Green Store 30</span></article>

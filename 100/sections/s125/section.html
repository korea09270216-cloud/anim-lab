<section class="sec" data-sec="s125">
  <div class="s125__wrap">
    <div class="s125__copy">
      <p class="s125__eyebrow">달빛로스터리 · 가맹 플랜 시뮬레이터</p>
      <h2 class="s125__h">매장 크기만<br>밀어보세요</h2>
      <p class="s125__p">평수를 고르면 본사 운영지원비 예시가 바로 계산됩니다.<br>월 납부와 연 납부도 바로 비교해 보세요.</p>
    </div>
    <div class="s125__card">
      <div class="s125__row">
        <span class="s125__k">매장 규모</span>
        <span class="s125__sz"><b class="s125__szn">24</b>평 · 약 <b class="s125__seat">43</b>석</span>
      </div>
      <div class="s125__slider" role="slider" tabindex="0" aria-label="매장 규모(평)" aria-valuemin="10" aria-valuemax="40" aria-valuenow="24">
        <div class="s125__track"><i class="s125__fill"></i></div>
        <svg class="s125__blob" aria-hidden="true"><path d=""/></svg>
        <ol class="s125__ticks" aria-hidden="true"><li>10</li><li>20</li><li>30</li><li>40</li></ol>
      </div>
      <div class="s125__row s125__row--t">
        <span class="s125__k">납부 방식</span>
        <button class="s125__tg" type="button" role="switch" aria-checked="false">
          <span class="s125__tl s125__tl--m">월납</span><span class="s125__tl s125__tl--y">연납 -10%</span>
          <i class="s125__knob"></i>
        </button>
      </div>
      <div class="s125__out">
        <span class="s125__ol">예상 운영지원비 <em class="s125__unit">/ 월</em></span>
        <div class="s125__roll" aria-live="polite"></div>
      </div>
      <label class="s125__agree">
        <input type="checkbox" class="s125__cb">
        <svg class="s125__box" viewBox="0 0 34 34"><rect class="s125__bg" x="2" y="2" width="30" height="30" rx="10"/><path class="s125__ck" d="M9 17.5l5.5 5.5L25 11.5"/></svg>
        <span>예시 시뮬레이션이며 실제 수익·비용을 보장하지 않음을 확인했습니다.</span>
      </label>
      <a class="s125__cta" href="#">이 조건으로 상담 받기 →</a>
    </div>
  </div>
</section>

<section class="sec" data-sec="s123">
  <div class="s123__wrap">
    <div class="s123__copy">
      <p class="s123__eyebrow">누룽지치킨 · 가맹 상담 접수</p>
      <h2 class="s123__h">세 줄이면<br>상담 <em>접수 끝</em></h2>
      <p class="s123__p">이름과 연락처, 희망 지역만 남겨주세요.<br>담당 슈퍼바이저가 영업일 1일 내에 연락드립니다.</p>
      <ul class="s123__steps"><li>01 정보 입력</li><li>02 접수 확인</li><li>03 담당자 연락</li></ul>
    </div>
    <form class="s123__form" novalidate autocomplete="off">
      <div class="s123__f" data-k="name">
        <label for="s123n">이름</label>
        <input id="s123n" type="text" maxlength="12" inputmode="text">
        <svg class="s123__ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <i class="s123__ul"></i><em class="s123__msg"></em>
      </div>
      <div class="s123__f" data-k="phone">
        <label for="s123p">연락처</label>
        <input id="s123p" type="tel" maxlength="13" inputmode="numeric">
        <svg class="s123__ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <i class="s123__ul"></i><em class="s123__msg"></em>
      </div>
      <div class="s123__f" data-k="region">
        <label for="s123r">희망 창업 지역</label>
        <input id="s123r" type="text" maxlength="20">
        <svg class="s123__ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <i class="s123__ul"></i><em class="s123__msg"></em>
      </div>
      <div class="s123__bw">
        <button class="s123__btn" type="submit">
          <span class="s123__lab">상담 신청하기</span>
          <svg class="s123__sp" viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/></svg>
          <svg class="s123__ok" viewBox="0 0 32 32"><path d="M8 17l5.5 5.5L24 11"/></svg>
          <svg class="s123__no" viewBox="0 0 32 32"><path d="M10 10l12 12M22 10L10 22"/></svg>
        </button>
      </div>
      <p class="s123__res" aria-live="polite"></p>
    </form>
  </div>
</section>

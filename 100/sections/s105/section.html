<section class="sec" data-sec="s105">
  <div class="s105__wrap">
    <div class="s105__left">
      <p class="s105__eyebrow">GOGIDANG · 가맹 예상 견적</p>
      <h2 class="s105__title">내 점포의 견적서를<br>지금 출력해 보세요</h2>
      <fieldset class="s105__grp" data-types>
        <legend>점포 형태</legend>
        <label class="s105__opt"><input type="radio" name="s105t" value="0"><span><b>배달·픽업형</b><i>10평 내외</i></span></label>
        <label class="s105__opt"><input type="radio" name="s105t" value="1" checked><span><b>소형 매장</b><i>16평 내외</i></span></label>
        <label class="s105__opt"><input type="radio" name="s105t" value="2"><span><b>표준 매장</b><i>28평 내외</i></span></label>
      </fieldset>
      <fieldset class="s105__grp" data-opts>
        <legend>추가 옵션</legend>
        <label class="s105__chk"><input type="checkbox" value="0"><span>테라스 좌석<i>+900</i></span></label>
        <label class="s105__chk"><input type="checkbox" value="1"><span>키오스크·POS 도입<i>+450</i></span></label>
        <label class="s105__chk"><input type="checkbox" value="2"><span>배달 전용 주방<i>+1,100</i></span></label>
      </fieldset>
      <p class="s105__hint">형태나 옵션을 바꾸면 영수증이 다시 출력됩니다. 단위: 만원</p>
    </div>
    <div class="s105__printer">
      <div class="s105__machine"><span class="s105__led" data-led></span><span class="s105__mb">PRINT·3000</span><span class="s105__slot"></span></div>
      <div class="s105__feed" data-feed>
        <article class="s105__paper" data-paper>
          <header class="s105__ph">
            <b>GOGIDANG</b>
            <span>가맹 예상 견적서</span>
            <em data-meta></em>
          </header>
          <ul class="s105__rows" data-rows></ul>
          <div class="s105__sum"><p><span>소계</span><b data-sub>0</b></p><p><span>부가세 10%</span><b data-vat>0</b></p></div>
          <div class="s105__total"><span>합 계</span><b data-total>0<small>만원</small></b>
            <div class="s105__stamp" data-stamp><span>견적</span><span>확인</span></div><i class="s105__ring" data-ring></i>
          </div>
          <div class="s105__bar" aria-hidden="true"></div>
          <p class="s105__pf">예시 견적이며 수익을 보장하지 않습니다</p>
        </article>
      </div>
    </div>
    <p class="s105__foot">※ 예시 시뮬레이션이며 수익을 보장하지 않습니다. 가상 브랜드 기준의 가정 수치이며 실제 견적은 계약 시 확정됩니다.</p>
  </div>
</section>

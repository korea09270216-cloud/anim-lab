<section class="sec" data-sec="s158">
  <div class="s158__stage">
    <canvas class="s158__cv" aria-hidden="true"></canvas>
    <div class="s158__head">
      <p class="s158__eyebrow">결 베이커리 · 반죽 연구노트</p>
      <h2 class="s158__title">점이 줄이 되고,<br>줄이 미로가 되는 반죽</h2>
    </div>
    <div class="s158__card">
      <b class="s158__num">01</b>
      <div class="s158__txt is-on" data-i="0"><h3>마블 쿠키</h3><p>반죽 위에 톡톡 번지는 초코칩. 점 하나가 둘로 갈라지며 한 판을 가득 채웁니다.</p></div>
      <div class="s158__txt" data-i="1"><h3>줄무늬 크루아상</h3><p>버터 층이 가늘게 늘어나 줄무늬가 됩니다. 접고 또 접어 만든 일흔일곱 겹.</p></div>
      <div class="s158__txt" data-i="2"><h3>산호 브레드</h3><p>가지가 뻗고 갈라지는 산호 같은 속살. 천연 발효종이 빚은 불규칙한 기공입니다.</p></div>
      <div class="s158__txt" data-i="3"><h3>미로 파이</h3><p>결이 길을 잃고 얽힌 파이 반죽. 한 조각마다 다른 미로가 구워집니다.</p></div>
    </div>
    <ol class="s158__rail">
      <li><button class="s158__item is-on" type="button">점</button></li>
      <li><button class="s158__item" type="button">줄무늬</button></li>
      <li><button class="s158__item" type="button">산호</button></li>
      <li><button class="s158__item" type="button">미로</button></li>
      <li class="s158__track" aria-hidden="true"><i class="s158__thumb"></i></li>
    </ol>
    <p class="s158__cue"><span></span>스크롤로 반죽의 결을 바꿔 보세요</p>
  </div>
</section>

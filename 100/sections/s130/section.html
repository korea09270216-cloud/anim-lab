<section class="sec" data-sec="s130">
  <div class="s130__wrap">
    <div class="s130__copy">
      <p class="s130__eyebrow">WAGLE CHICKEN · 창업 상담</p>
      <h2 class="s130__h">내 동네 상권이<br>비어 있는지<br>먼저 확인하세요</h2>
      <p class="s130__lead">접수 후 영업일 1일 이내, 담당 슈퍼바이저가 상권과 예상 투자금 기준으로 직접 회신합니다.</p>
      <ol class="s130__steps">
        <li><b>01</b>상담 신청</li>
        <li><b>02</b>상권 검토</li>
        <li><b>03</b>매장 방문 상담</li>
      </ol>
      <div class="s130__cta">
        <button class="s130__btn s130__btn--main" type="button" command="show-modal" commandfor="s130-drawer">창업 상담 신청<span aria-hidden="true">→</span></button>
        <button class="s130__btn s130__btn--ghost" type="button" popovertarget="s130-pop" id="s130-anchor">상담 가능 지역 보기</button>
      </div>
    </div>

    <div class="s130__map" aria-hidden="true">
      <div class="s130__land"></div>
      <div class="s130__jeju"></div>
      <b class="s130__pin" style="--x:44%;--y:21%;--d:0s">서울</b>
      <b class="s130__pin" style="--x:30%;--y:30%;--d:.6s">인천</b>
      <b class="s130__pin" style="--x:46%;--y:46%;--d:1.2s">대전</b>
      <b class="s130__pin" style="--x:64%;--y:56%;--d:1.8s">대구</b>
      <b class="s130__pin" style="--x:36%;--y:68%;--d:2.4s">광주</b>
      <b class="s130__pin" style="--x:70%;--y:72%;--d:3s">부산</b>
    </div>

    <div id="s130-pop" class="s130__pop" popover>
      <p class="s130__pop-t">상담 가능 지역</p>
      <ul>
        <li><span>서울 강남·송파</span><em class="is-hot">마감 임박</em></li>
        <li><span>경기 남부</span><em>상담 가능</em></li>
        <li><span>부산·울산</span><em>상담 가능</em></li>
        <li><span>대구·경북</span><em class="is-hot">2곳 남음</em></li>
      </ul>
    </div>

    <dialog id="s130-drawer" class="s130__drawer" closedby="any" aria-labelledby="s130-dt">
      <form method="dialog" class="s130__form">
        <header class="s130__dh s130__fld">
          <div><h3 id="s130-dt">창업 상담 신청</h3><p>평일 10:00–18:00 · 1영업일 내 회신</p></div>
          <button class="s130__x" type="button" command="close" commandfor="s130-drawer" aria-label="닫기">×</button>
        </header>
        <label class="s130__fld s130__in"><span>이름</span><input type="text" placeholder="홍길동" autocomplete="off"></label>
        <label class="s130__fld s130__in"><span>연락처</span><input type="tel" placeholder="010-0000-0000" autocomplete="off"></label>
        <fieldset class="s130__fld s130__chips"><legend>희망 지역</legend>
          <label><input type="radio" name="s130-area" checked><i>서울</i></label>
          <label><input type="radio" name="s130-area"><i>경기·인천</i></label>
          <label><input type="radio" name="s130-area"><i>부산·경남</i></label>
          <label><input type="radio" name="s130-area"><i>대구·경북</i></label>
        </fieldset>
        <fieldset class="s130__fld s130__chips"><legend>오픈 희망 시기</legend>
          <label><input type="radio" name="s130-when"><i>3개월 내</i></label>
          <label><input type="radio" name="s130-when" checked><i>6개월 내</i></label>
          <label><input type="radio" name="s130-when"><i>정보 수집 중</i></label>
        </fieldset>
        <label class="s130__fld s130__agree"><input type="checkbox" checked><span>개인정보 수집·이용에 동의합니다</span></label>
        <button class="s130__fld s130__submit" type="submit">상담 예약 접수</button>
      </form>
    </dialog>
  </div>
</section>

<section class="sec" data-sec="s117">
  <div class="s117__stage">
    <div class="s117__orb" aria-hidden="true"></div>

      <ul class="s117__stats">
        <li><b>84</b><span>전국 직영·가맹점</span></li>

        <div class="s117__fh">
          <div><p class="s117__ft">가맹 상담 신청</p><p class="s117__fs">영업일 1일 이내 담당자가 연락드립니다</p></div>
          <button type="button" class="s117__x" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        </div>
        <div class="s117__f"><label>성함</label><input class="s117__in" data-fill="박민재" type="text" placeholder="홍길동"></div>
        <div class="s117__f"><label>연락처</label><input class="s117__in" data-fill="010-3392-8841" type="text" placeholder="010-0000-0000"></div>

          <div class="s117__chips"><span class="s117__chip">3개월 내</span><span class="s117__chip is-on">6개월 내</span><span class="s117__chip">1년 내</span></div>

    </div>

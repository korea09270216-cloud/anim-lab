      <p class="s183__eyebrow">長夜 <span>장노출 천체사진관</span></p>
      <h2 class="s183__h">어둠을 오래 바라보면,<br>앉아 계신 분이<br>보입니다.</h2>
      <p class="s183__p">장야는 셔터를 네 시간 열어 두는 천체사진관입니다. 한 번 지나간 빛은 아주 작지만, 수백만 번이 겹치면 어둠 속에서 한 분의 형상이 서서히 떠오릅니다. 노출이 끝나는 순간까지, 같은 하늘은 한 번도 같은 얼굴이 아닙니다.</p>

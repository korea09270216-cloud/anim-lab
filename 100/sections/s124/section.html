<section class="sec" data-sec="s124">
  <div class="s124__wrap">
    <div class="s124__copy">
      <p class="s124__eyebrow">소담도시락 · 가맹 상담 현황</p>
      <h2 class="s124__h">지금도 누군가<br>상담을 <em>신청 중</em></h2>
      <div class="s124__count">
        <span class="s124__cn"><b class="s124__num">128</b></span>
        <span class="s124__cl">이번 달 상담 접수(건)</span>
      </div>
      <form class="s124__form" autocomplete="off" novalidate>
        <div class="s124__f"><label for="s124n">이름</label><input id="s124n" type="text" maxlength="8" placeholder="홍길동"></div>
        <div class="s124__f"><label for="s124t">연락처</label><input id="s124t" type="tel" maxlength="13" placeholder="010-0000-0000"></div>

      </form>
      <p class="s124__state"><i></i><span>알림 재생 중</span></p>
    </div>
    <div class="s124__stage">
      <div class="s124__grid" aria-hidden="true"></div>
      <div class="s124__list"></div>
      <p class="s124__note">※ 화면의 상담 신청 내역은 <b>데모 데이터</b>입니다. 실제 서비스에서는 접수된 실데이터(마스킹 처리)만 집계해 노출합니다.</p>
    </div>
  </div>
</section>

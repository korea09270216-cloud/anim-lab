        <p>해발 1,400m 고지대, 손으로 한 알씩 따낸 체리에서 모든 게 시작됩니다.</p>
        <p>건조와 선별을 거쳐 이름표를 단 생두가 로스터리에 도착합니다.</p>
        <p>배전 곡선을 매 배치마다 기록하며 향이 가장 열리는 순간에 멈춥니다.</p>
        <p>93도의 물로 29초, 단맛이 먼저 오도록 천천히 내립니다.</p>
        <p>갓 내린 한 잔이 당신 앞에 놓이기까지 열네 단계, 온도가 지킵니다.</p>

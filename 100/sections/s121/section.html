<section class="sec" data-sec="s121">
  <div class="s121__wrap">
    <div class="s121__copy">
      <p class="s121__eyebrow">참새방앗간 · 가맹 상담 이벤트</p>
      <h2 class="s121__h">긁어서<br>확인하세요,<br><em>첫 번째 혜택</em></h2>
      <p class="s121__p">상담을 신청하신 예비 점주님께만 드리는 창업 혜택.<br>카드를 긁으면 이번 달 혜택이 공개됩니다.</p>
      <div class="s121__meter" aria-hidden="true"><i class="s121__bar"></i><span class="s121__pct">0%</span></div>
      <button class="s121__again" type="button">다시 긁기</button>
    </div>
    <div class="s121__stage">
      <div class="s121__card">
        <div class="s121__prize">
          <small>이번 달 창업 혜택</small>
          <strong class="s121__big"><span>가맹비</span> <b>50%</b> <span>지원</span></strong>
          <p>교육비 면제 · 인테리어 감리 무상 · 선착순 20호점</p>
          <a class="s121__cta" href="#">혜택 받고 상담 신청 →</a>
        </div>
        <canvas class="s121__cv" width="560" height="320"></canvas>
        <span class="s121__coin" aria-hidden="true"></span>
      </div>
      <p class="s121__note">※ 예시 이벤트 화면입니다. 실제 혜택은 상담 시 안내되는 정보공개서 기준을 따릅니다.</p>
    </div>
  </div>
  <i class="s121__dot s121__dot--a"></i><i class="s121__dot s121__dot--b"></i>
</section>

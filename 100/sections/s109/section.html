<section class="sec" data-sec="s109">
  <div class="s109__wrap">
    <div class="s109__head">
      <p class="s109__eyebrow">달빛수제비 · 창업 유형 비교</p>
      <h2 class="s109__title">나에게 맞는<br>매장 유형을<br>골라 비교하세요</h2>
      <div class="s109__budget">
        <div class="s109__budget-top"><span>내 투자 가능 금액</span><b class="s109__bv">1억 2,000만원</b></div>
        <input class="s109__range" type="range" min="4000" max="30000" step="500" value="12000" aria-label="투자 가능 금액(만원)">
        <div class="s109__ticks"><span>4,000만</span><span>3억</span></div>
      </div>
      <p class="s109__note">* 모든 수치는 가상 브랜드의 예시이며 실제 수익을 보장하지 않습니다.</p>
    </div>

    <div class="s109__panel">
      <div class="s109__seg" role="tablist">
        <em class="s109__badge">예산 맞춤 추천</em>
        <i class="s109__ind"></i>
        <button type="button" role="tab" data-i="0"><span>부업형</span><small>소형 · 1인 운영</small></button>
        <button type="button" role="tab" data-i="1"><span>부부형</span><small>표준 · 2인 운영</small></button>
        <button type="button" role="tab" data-i="2"><span>은퇴형</span><small>중형 · 안정 운영</small></button>
        <button type="button" role="tab" data-i="3"><span>다점포형</span><small>대형 · 점장 체제</small></button>
      </div>
      <div class="s109__table">
        <div class="s109__row" data-k="invest" data-kind="num"><span class="s109__k">초기 투자금</span><div class="s109__v"><span class="s109__reel"></span><u>만원</u></div><i class="s109__bar"><b></b></i></div>
        <div class="s109__row" data-k="sales" data-kind="num"><span class="s109__k">월 예상 매출</span><div class="s109__v"><span class="s109__reel"></span><u>만원</u></div><i class="s109__bar"><b></b></i></div>
        <div class="s109__row" data-k="payback" data-kind="num"><span class="s109__k">회수 예상 기간</span><div class="s109__v"><span class="s109__reel"></span><u>개월</u></div><i class="s109__bar"><b></b></i></div>
        <div class="s109__row" data-k="size" data-kind="num"><span class="s109__k">매장 규모</span><div class="s109__v"><span class="s109__reel"></span><u>평</u></div><i class="s109__bar"><b></b></i></div>
        <div class="s109__row" data-k="staff" data-kind="num"><span class="s109__k">필요 인원</span><div class="s109__v"><span class="s109__reel"></span><u>명</u></div><i class="s109__bar"><b></b></i></div>
        <div class="s109__row" data-k="mode" data-kind="txt"><span class="s109__k">운영 형태</span><div class="s109__v s109__v--t"><span class="s109__txt"></span></div></div>
        <div class="s109__row" data-k="sup" data-kind="txt"><span class="s109__k">본사 지원</span><div class="s109__v s109__v--t"><span class="s109__txt"></span></div></div>
      </div>
    </div>
  </div>
</section>

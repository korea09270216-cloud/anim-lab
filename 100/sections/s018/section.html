  <div class="s018__top"><b>하루한끼 농장</b><span>제철 채소 정기구독</span><span>No. 07 — 가을호</span></div>
  <p class="s018__text">우리는 <mark>마트에 없는 채소</mark>를 키웁니다. 수요일 새벽에 수확해서 <mark>그날 저녁 식탁</mark>까지, 중간에 냉장고는 없습니다. <mark>덜 예쁘게 자란 것</mark>이 대체로 더 맛있다는 걸 이 년 만에 배웠습니다.</p>

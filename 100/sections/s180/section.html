<section class="sec" data-sec="s180">
  <div class="s180__wrap">
    <div class="s180__copy">
      <p class="s180__eyebrow">삼미 소스바 <span>三味</span></p>
      <h2 class="s180__title">한 숟갈이 닿는 맛은<br><em>출발점</em>이 정한다</h2>
      <p class="s180__lead">청양 고추장, 유자 간장, 와사비 마요. 세 가지 소스 위에서 숟가락을 놓으면 어느 맛에 멈출지는 시작 위치 단 하나로 갈립니다. 삼미 소스바는 그 경계를 한 점도 남김없이 그려 두었습니다.</p>
      <ul class="s180__legend">
        <li><i style="--c:#ee4b2b"></i><b>청양 고추장</b><span data-pct="0">—</span></li>
        <li><i style="--c:#f6b93b"></i><b>유자 간장</b><span data-pct="1">—</span></li>
        <li><i style="--c:#1fb5a5"></i><b>와사비 마요</b><span data-pct="2">—</span></li>
      </ul>
      <p class="s180__note" data-r="note">경계를 계산하는 중입니다</p>
      <a class="s180__cta" href="#">가맹 상담 신청 <span aria-hidden="true">→</span></a>
    </div>
    <figure class="s180__fig">
      <canvas class="s180__cv" width="560" height="560" aria-label="자기 진자 끌개 영역 지도"></canvas>
      <figcaption>눌러서 숟가락을 놓아 보세요 — 색은 숟가락이 마지막에 멈추는 맛입니다</figcaption>
    </figure>
  </div>
</section>

      <p class="s193__eyebrow">世代製菓所 <span>세대제빵소 발효 연구실</span></p>
      <h2 class="s193__h">한 판의 반죽이<br>천조 세대를<br>건너뜁니다.</h2>
      <p class="s193__p">세대제빵소는 같은 모양이 반복되는 발효를 한 번만 계산하고 나머지는 기억해 둡니다. 그래서 오늘 구운 빵의 천조 세대 뒤 모습도 숨 한 번 쉬는 사이에 내다볼 수 있습니다.</p>

        <div><dt>이번 점프</dt><dd data-k="jump">1 세대</dd></div>
        <div><dt>살아 있는 세포</dt><dd data-k="pop">0</dd></div>

        <div><dt>재사용률</dt><dd data-k="hit">0%</dd></div>

      </dl>

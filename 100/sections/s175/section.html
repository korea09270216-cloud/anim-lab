      <h2 class="s175__title">0.0001°의 차이가<br>한 잔을 <em>바꿉니다</em></h2>
      <p class="s175__lead">같은 원두, 같은 물, 같은 손. 그래도 첫 한 방울의 각도가 머리카락 하나만큼 다르면 결말은 전혀 달라집니다. 나비 커피랩은 그 흔들림을 지도로 그려, 가장 흔들리지 않는 한 잔의 자리를 찾아냅니다.</p>
      <dl class="s175__log">
        <div><dt>지도가 말한 시간</dt><dd data-r="pred">—</dd></div>
        <div><dt>실제로 흐른 시간</dt><dd data-r="now">0.00초</dd></div>
        <div><dt>에너지 오차</dt><dd data-r="err">0</dd></div>
      </dl>
      <a class="s175__cta" href="#">가맹 상담 신청 <span aria-hidden="true">→</span></a>

      <figcaption>같은 자리에서 출발한 두 진자 — 주황은 0.0001° 만 다릅니다</figcaption>

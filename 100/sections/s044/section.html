    <article class="s044__slide is-on" style="--bg:#d8ff3d;--ink:#10140a;--ac:#2a3bff">
      <p class="s044__kicker">RUNNR POP-UP · 성수 · 11.01–11.30</p>
      <h2 class="s044__head"><span class="ln"><span>달리는</span></span><span class="ln"><span>도시의 <b>첫걸음</b></span></span></h2>
      <p class="s044__sub">신제품 러닝화 라인 'AERO 3'를 가장 먼저 신어볼 수 있는 한 달. 입장 무료, 러닝 클럽 매주 토요일 7시.</p>
      <div class="s044__shape s044__shape--a"><i></i><i></i></div>
    </article>
    <article class="s044__slide" style="--bg:#2a3bff;--ink:#f3f5ff;--ac:#ff5fa2">
      <p class="s044__kicker">AERO 3 · 초경량 200g</p>
      <h2 class="s044__head"><span class="ln"><span>구름 위를</span></span><span class="ln"><span>밟는 <b>200g</b></span></span></h2>
      <p class="s044__sub">발포 폼 미드솔과 한 장짜리 니트 어퍼. 마라톤 완주자 120명의 피드백으로 세 번 다시 만들었습니다.</p>
      <div class="s044__shape s044__shape--b"><i></i><i></i><i></i></div>
    </article>
    <article class="s044__slide" style="--bg:#ffb9cf;--ink:#2b0a1a;--ac:#d8ff3d">
      <p class="s044__kicker">RUN CLUB · 매주 토요일</p>
      <h2 class="s044__head"><span class="ln"><span>함께 뛰면</span></span><span class="ln"><span>5km는 <b>산책</b></span></span></h2>
      <p class="s044__sub">초보도 환영. 페이스 그룹을 나눠 한강까지 왕복하고, 돌아와서는 시원한 음료가 기다립니다.</p>
      <div class="s044__shape s044__shape--c"><i></i><i></i></div>
    </article>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Sections — Animation Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0d;color:#f4f1ea;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;padding:40px 4vw 120px}
a{color:inherit;text-decoration:none}
h1{font-size:clamp(36px,6vw,96px);font-weight:900;letter-spacing:-.03em;line-height:1}
h1 b{color:#ff4d2e}
.sub{margin:14px 0 22px;color:#8a8a90}
.modes{display:flex;gap:10px;margin-bottom:18px}
.modes button{padding:12px 22px;border-radius:12px;border:1px solid #fff3;background:#151518;color:#ddd;cursor:pointer;font:inherit;font-weight:700}
.modes button.on{background:#f4f1ea;color:#111;border-color:#f4f1ea}
.bar{position:sticky;top:0;background:#0b0b0dee;backdrop-filter:blur(6px);z-index:5;padding:10px 0 12px;margin-bottom:20px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.row>label{font-size:11px;letter-spacing:.12em;color:#8a8a90;min-width:46px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid #fff3;background:none;color:#ddd;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:#ff4d2e;border-color:#ff4d2e;color:#fff}
.chip small{opacity:.7;margin-left:4px}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 22px;padding:16px;border-radius:14px;background:#151518;border:1px solid #ffffff14}
.flow h4{width:100%;font-size:12px;color:#8a8a90;letter-spacing:.1em;margin-bottom:4px}
.flow a{font-size:12px;padding:6px 10px;border-radius:8px;background:#ffffff10}
.flow a b{color:#ff4d2e;margin-right:6px;font-family:ui-monospace,monospace}
.flow i{font-style:normal;color:#555;align-self:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.stagehead{grid-column:1/-1;margin-top:18px;padding-bottom:8px;border-bottom:1px solid #ffffff22}
.stagehead h2{font-size:22px}.stagehead h2 b{color:#ff4d2e;margin-right:8px;font-family:ui-monospace,monospace}
.stagehead p{font-size:13px;color:#8a8a90;margin-top:4px}
.card{display:block;border-radius:14px;overflow:hidden;background:#151518;border:1px solid #ffffff14;transition:transform .35s,border-color .3s}
.card:hover{transform:translateY(-6px);border-color:#ff4d2e}
.card__img{aspect-ratio:16/9;background:#222 center/cover;position:relative}
.card__n{position:absolute;left:10px;top:10px;font-size:11px;padding:3px 8px;border-radius:99px;background:#000a;font-family:ui-monospace,monospace}
.card__s{position:absolute;right:10px;top:10px;font-size:12px;padding:3px 8px;border-radius:99px;background:#ff4d2e;color:#fff;font-weight:700}
.card__b{padding:14px 16px 18px}
.card__b h3{font-size:17px;margin-bottom:6px}
.card__b p{font-size:13px;color:#a0a0a8;line-height:1.5;margin-bottom:10px}
.card__b .fnote{color:#f4f1ea;background:#ff4d2e1a;border-left:3px solid #ff4d2e;padding:8px 10px;border-radius:0 8px 8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags i{font-style:normal;font-size:11px;padding:3px 8px;border-radius:99px;background:#ffffff14;color:#cfcfd4}
.tags i.ind{background:#3b82f622;color:#9cc2ff}.tags i.pt{background:#22c55e22;color:#86efac}
.empty{grid-column:1/-1;color:#8a8a90;padding:40px 0}
.pickbox{margin:0 0 22px;padding:18px 20px;border-radius:14px;background:#151518;border:1px solid #ffffff14;font-size:13px;line-height:1.65;color:#cfcfd4}
.pickbox h4{font-size:12px;letter-spacing:.1em;color:#ff4d2e;margin:10px 0 4px}.pickbox h4:first-child{margin-top:0}
.pickbox ol,.pickbox ul{padding-left:18px}.pickbox li{margin:2px 0}
.card__r{position:absolute;left:10px;bottom:10px;font-size:11px;padding:3px 8px;border-radius:99px;background:#000a;font-family:ui-monospace,monospace}
.card__b .dis{font-size:12px;color:#f3c98b;margin:-2px 0 10px;line-height:1.5}
.alt{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.alt a{display:block;padding:10px 12px;border-radius:10px;background:#151518;border:1px solid #ffffff14;font-size:13px;color:#cfcfd4}
.alt a:hover{border-color:#ff4d2e}.alt b{color:#ff4d2e;font-family:ui-monospace,monospace;margin-right:6px}
</style>
</head>
<body>
<h1><span id="n">150</span> <b>SECTIONS</b></h1>
<p class="sub" id="sub"></p>
<div class="modes" id="modes"></div>
<div class="bar" id="bar"></div>
<div id="flow"></div>
<div class="grid" id="grid"></div>
<script>
const $=id=>document.getElementById(id);
const stars=n=>'★'.repeat(n);
fetch('./manifest.json?'+Date.now()).then(r=>r.json()).then(M=>{
  const list=M.list, fran=list.filter(s=>s.fran);
  const st={mode:location.hash==='#franchise'?'fran':location.hash==='#picks'?'pick':'all',grp:'ALL',cat:'ALL',stage:'ALL',ind:'ALL',pt:'ALL',min:1};
  $('n').textContent=list.length; document.title=list.length+' Sections — Animation Lab';
  $('sub').textContent=`${list.length}개 섹션 · 클릭하면 단독 뷰어로 열려요 (스크롤·마우스 인터랙션 그대로)`;
  const chip=(on,attr,label,extra='')=>`<button class="chip${on?' on':''}" ${attr}>${label}${extra}</button>`;
  const cnt=f=>fran.filter(f).length;
  const card=(s,fr)=>`<a class="card" href="./view.html?s=${s.id}" target="_blank">
    <div class="card__img" style="background-image:url(./shots/s${s.id}_a.jpg)"><span class="card__n">s${s.id}</span>${fr?`<span class="card__s">${stars(s.fran.fit)}</span>`:''}</div>
    <div class="card__b"><h3>${s.title}</h3>
    ${fr?`<p class="fnote">${s.fran.note}</p>`:`<p>${s.desc}</p>`}
    <div class="tags">${fr?`<i class="ind">${s.fran.ind.join('·')}</i>${s.fran.pt!=='both'?`<i class="pt">${s.fran.pt==='landing'?'랜딩 최적':'브랜드 전용'}</i>`:''}`:''}${s.tech.map(t=>`<i>${t}</i>`).join('')}</div></div></a>`;
  function draw(){
    document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.mode));
    const grid=$('grid'), bar=$('bar'), flow=$('flow');
    if(st.mode==='pick'){
      const P=M.picks, picked=list.filter(s=>s.pick), byId={}; list.forEach(s=>byId[s.id]=s);
      bar.innerHTML=`<div class="row"><label>분류</label>${chip(st.grp==='ALL','data-g="ALL"','전체',`<small>${picked.length}</small>`)}${P.groups.map(g=>chip(st.grp===g.key,`data-g="${g.key}"`,g.name,`<small>${picked.filter(s=>s.pick.g===g.key).length}</small>`)).join('')}</div>`;
      flow.innerHTML=`<div class="pickbox"><h4>${P.title}</h4><p>${P.note}</p>
        <details><summary style="cursor:pointer;margin-top:8px;color:#fff">선정 기준 · 토론 과정 보기</summary>
        <h4>선정 기준</h4><ul>${P.criteria.map(c=>`<li>${c}</li>`).join('')}</ul>
        <h4>토론 과정</h4><ol>${P.process.map(c=>`<li>${c}</li>`).join('')}</ol></details></div>`;
      let html='', n=0;
      for(const g of P.groups){
        if(st.grp!=='ALL'&&st.grp!==g.key){n+=picked.filter(s=>s.pick.g===g.key).length;continue}
        const items=picked.filter(s=>s.pick.g===g.key).sort((a,b)=>a.pick.i-b.pick.i);
        html+=`<div class="stagehead"><h2><b>${g.key}</b>${g.name}</h2></div>`+items.map(s=>`<a class="card" href="./view.html?s=${s.id}" target="_blank">
          <div class="card__img" style="background-image:url(./shots/s${s.id}_a.jpg)"><span class="card__n">s${s.id}</span><span class="card__r">1R ${s.pick.r1}표 · 2R ${s.pick.r2}표</span></div>
          <div class="card__b"><h3>${s.title}</h3><p class="fnote">${s.pick.reason}</p>${s.pick.dissent?`<p class="dis">⚠ ${s.pick.dissent}</p>`:''}
          <div class="tags">${s.tech.map(t=>`<i>${t}</i>`).join('')}</div></div></a>`).join('');
      }
      if(st.grp==='ALL') html+=`<div class="stagehead"><h2><b>＋</b>아깝게 탈락·추천 의견</h2><p>토론에서 거론됐지만 30선에 못 든 것과 그 이유</p></div><div class="alt">${P.alternates.map(a=>`<a href="./view.html?s=${a.id}" target="_blank"><b>s${a.id}</b>${(byId[a.id]||{}).title||''}<br><span style="color:#8a8a90">${a.why}</span></a>`).join('')}</div>`;
      grid.innerHTML=html;
      return;
    }
    if(st.mode==='all'){
      flow.innerHTML='';
      const cats=['ALL',...new Set(list.map(s=>s.category))];
      bar.innerHTML=`<div class="row">${cats.map(c=>chip(c===st.cat,`data-cat="${c}"`,c)).join('')}</div>`;
      grid.innerHTML=list.filter(s=>st.cat==='ALL'||s.category===st.cat).map(s=>card(s,false)).join('');
      return;
    }
    // 창업·프랜차이즈 모드
    const inds=['ALL',...M.axes.ind];
    bar.innerHTML=`
      <div class="row"><label>단계</label>${chip(st.stage==='ALL','data-stage="ALL"','전체',`<small>${fran.length}</small>`)}${M.stages.map(s=>chip(st.stage===s.key,`data-stage="${s.key}"`,s.name,`<small>${cnt(x=>x.fran.stage===s.key)}</small>`)).join('')}</div>
      <div class="row"><label>업종</label>${inds.map(i=>chip(st.ind===i,`data-ind="${i}"`,i==='ALL'?'전체':i)).join('')}</div>
      <div class="row"><label>유형</label>${chip(st.pt==='ALL','data-pt="ALL"','전체')}${chip(st.pt==='landing','data-pt="landing"','랜딩 최적')}${chip(st.pt==='brand','data-pt="brand"','브랜드 전용')}
        <label style="margin-left:14px">등급</label>${chip(st.min===3,'data-min="3"','★★★ 핵심만')}${chip(st.min===1,'data-min="1"','전체')}</div>`;
    flow.innerHTML=st.stage==='ALL'&&st.ind==='ALL'&&st.pt==='ALL'&&st.min===1?`<div class="flow"><h4>추천 창업문의 랜딩 구성안 (위→아래 순서)</h4>${M.flow.map((f,i)=>`${i?'<i>→</i>':''}<a href="./view.html?s=${f[1]}" target="_blank"><b>${f[1]}</b>${f[2]}</a>`).join('')}</div>`:'';
    const ok=s=>(st.stage==='ALL'||s.fran.stage===st.stage)&&(st.ind==='ALL'||s.fran.ind.includes(st.ind)||s.fran.ind.includes('전업종'))
      &&(st.pt==='ALL'||s.fran.pt===st.pt||s.fran.pt==='both')&&s.fran.fit>=st.min;
    let html='';
    for(const stg of M.stages){
      const items=fran.filter(s=>s.fran.stage===stg.key&&ok(s)).sort((a,b)=>b.fran.fit-a.fran.fit||a.id-b.id);
      if(!items.length) continue;
      html+=`<div class="stagehead"><h2><b>${stg.key}</b>${stg.name}</h2><p>${stg.q}</p></div>`+items.map(s=>card(s,true)).join('');
    }
    grid.innerHTML=html||'<p class="empty">조건에 맞는 섹션이 없어요</p>';
  }
  $('modes').innerHTML=`<button data-m="all">${list.length} 전체</button><button data-m="fran">🏪 창업·프랜차이즈 추천 <small>${fran.length}</small></button><button data-m="pick">✨ 클로드 추천 30선</button>`;
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-m],[data-cat],[data-stage],[data-ind],[data-pt],[data-min],[data-g]'); if(!t) return;
    const d=t.dataset;
    if(d.g)st.grp=d.g;
    if(d.m){st.mode=d.m;history.replaceState(null,'',d.m==='fran'?'#franchise':d.m==='pick'?'#picks':location.pathname)}
    if(d.cat)st.cat=d.cat; if(d.stage)st.stage=d.stage; if(d.ind)st.ind=d.ind; if(d.pt)st.pt=d.pt; if(d.min)st.min=+d.min;
    draw();
  });
  draw();
});
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Sections — Animation Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0d;color:#f4f1ea;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;padding:40px 4vw 120px}
a{color:inherit;text-decoration:none}
h1{font-size:clamp(36px,6vw,96px);font-weight:900;letter-spacing:-.03em;line-height:1}
h1 b{color:#ff4d2e}
.sub{margin:14px 0 28px;color:#8a8a90}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;position:sticky;top:0;padding:12px 0;background:#0b0b0d;z-index:5}
.filters button{padding:8px 16px;border-radius:99px;border:1px solid #fff3;background:none;color:#ddd;cursor:pointer;font:inherit;font-size:13px}
.filters button.on{background:#ff4d2e;border-color:#ff4d2e;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{display:block;border-radius:14px;overflow:hidden;background:#151518;border:1px solid #ffffff14;transition:transform .35s,border-color .3s}
.card:hover{transform:translateY(-6px);border-color:#ff4d2e}
.card__img{aspect-ratio:16/9;background:#222 center/cover;position:relative}
.card__n{position:absolute;left:10px;top:10px;font-size:11px;padding:3px 8px;border-radius:99px;background:#000a;font-family:ui-monospace,monospace}
.card__b{padding:14px 16px 18px}
.card__b h3{font-size:17px;margin-bottom:6px}
.card__b p{font-size:13px;color:#a0a0a8;line-height:1.5;margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags i{font-style:normal;font-size:11px;padding:3px 8px;border-radius:99px;background:#ffffff14;color:#cfcfd4}
</style>
</head>
<body>
<h1>100 <b>SECTIONS</b></h1>
<p class="sub" id="sub"></p>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
<script>
fetch('./manifest.json?'+Date.now()).then(r=>r.json()).then(list=>{
  document.getElementById('sub').textContent = list.length+'개 섹션 · 클릭하면 단독 뷰어(스크롤·마우스 인터랙션 그대로)로 열려요';
  const cats=['ALL',...new Set(list.map(s=>s.category))];
  const f=document.getElementById('filters'), g=document.getElementById('grid');
  const draw=c=>{
    g.innerHTML=list.filter(s=>c==='ALL'||s.category===c).map(s=>`
    <a class="card" href="./view.html?s=${s.id}" target="_blank">
      <div class="card__img" style="background-image:url(./shots/s${s.id}_a.jpg)"><span class="card__n">s${s.id}</span></div>
      <div class="card__b"><h3>${s.title}</h3><p>${s.desc}</p><div class="tags">${s.tech.map(t=>`<i>${t}</i>`).join('')}</div></div>
    </a>`).join('');
    [...f.children].forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  };
  f.innerHTML=cats.map(c=>`<button data-c="${c}">${c}</button>`).join('');
  f.onclick=e=>{if(e.target.dataset.c)draw(e.target.dataset.c)};
  draw('ALL');
});
</script>
</body>
</html>
